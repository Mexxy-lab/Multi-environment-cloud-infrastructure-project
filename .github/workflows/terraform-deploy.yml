# Manually triggered Terraform deployment workflow.
# This workflow is separate from validation-only CI.
name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud provider
        type: choice
        required: true
        options:
          - aws
          - azure

      environment:
        description: Target environment
        type: choice
        required: true
        options:
          - dev
          - staging
          - prod

      action:
        description: Plan only, or plan and apply
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply

# Grant only repository read access by default.
permissions:
  contents: read

# Prevent overlapping deployments to the same cloud environment.
concurrency:
  group: terraform-deploy-${{ inputs.cloud }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    name: "${{ inputs.action }} ${{ inputs.cloud }}/${{ inputs.environment }}"
    runs-on: ubuntu-latest

    # Configure GitHub Environments named dev, staging, and prod.
    # Required reviewers can be configured for the prod environment.
    environment: ${{ inputs.environment }}

    # id-token: write is required for OIDC; no static cloud keys are needed.
    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      # Authenticate to AWS using a role trusted for GitHub OIDC.
      - name: Configure AWS credentials
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActionsTerraform

      # Authenticate to Azure using an Entra federated identity credential.
      - name: Log in to Azure
        if: inputs.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Map the selected cloud/environment to its Terraform root.
      - name: Select Terraform root
        id: root
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.cloud }}/${{ inputs.environment }}" in
            aws/dev)
              echo "path=aws/environments/dev" >> "$GITHUB_OUTPUT"
              ;;
            aws/staging)
              echo "path=aws/environments/staging" >> "$GITHUB_OUTPUT"
              ;;
            aws/prod)
              echo "path=aws/environments/prod" >> "$GITHUB_OUTPUT"
              ;;
            azure/dev)
              echo "path=azure/environments/dev" >> "$GITHUB_OUTPUT"
              ;;
            azure/staging)
              echo "path=azure/environments/staging" >> "$GITHUB_OUTPUT"
              ;;
            azure/prod)
              echo "path=azure/environments/prod" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported cloud/environment combination" >&2
              exit 1
              ;;
          esac

      # Initialize the S3 backend using actual GitHub variable values.
      # This requires the bucket to exist and the OIDC role to have state access.
      - name: Initialize AWS backend
        if: inputs.cloud == 'aws'
        working-directory: ${{ steps.root.outputs.path }}
        env:
          STATE_BUCKET: ${{ vars.AWS_TF_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$STATE_BUCKET" || {
            echo "Missing GitHub variable AWS_TF_STATE_BUCKET" >&2
            exit 1
          }

          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=aws/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="use_lockfile=true"

      # Initialize the Azure Blob backend using actual GitHub variable values.
      # This requires the Storage Account/container and Blob data permissions.
      - name: Initialize Azure backend
        if: inputs.cloud == 'azure'
        working-directory: ${{ steps.root.outputs.path }}
        env:
          STATE_RESOURCE_GROUP: ${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}
          STATE_STORAGE_ACCOUNT: ${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.AZURE_TF_STATE_CONTAINER }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$STATE_RESOURCE_GROUP" || {
            echo "Missing AZURE_TF_STATE_RESOURCE_GROUP" >&2
            exit 1
          }

          test -n "$STATE_STORAGE_ACCOUNT" || {
            echo "Missing AZURE_TF_STATE_STORAGE_ACCOUNT" >&2
            exit 1
          }

          test -n "$STATE_CONTAINER" || {
            echo "Missing AZURE_TF_STATE_CONTAINER" >&2
            exit 1
          }

          terraform init -input=false \
            -backend-config="resource_group_name=${STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${STATE_CONTAINER}" \
            -backend-config="key=azure/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="use_cli=true" \
            -backend-config="use_azuread_auth=true"

      # Create and display a plan. No resources are changed by terraform plan.
      - name: Create Terraform plan
        working-directory: ${{ steps.root.outputs.path }}
        run: terraform plan -input=false -no-color -out=tfplan

      # Only apply when the operator explicitly selected action=apply.
      # GitHub Environment approval, if configured, happens before this job starts.
      - name: Apply Terraform plan
        if: inputs.action == 'apply'
        working-directory: ${{ steps.root.outputs.path }}
        run: terraform apply -input=false -no-color tfplan