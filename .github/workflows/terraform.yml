# Multi-cloud Terraform CI.
# Validates Terraform without provisioning resources or requiring cloud credentials.
name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - "aws/**"
      - "azure/**"
      - ".github/workflows/terraform.yml"
      - ".tflint.hcl"
  push:
    branches: [main]
    paths:
      - "aws/**"
      - "azure/**"
      - ".github/workflows/terraform.yml"
      - ".tflint.hcl"
  workflow_dispatch:

# These jobs only need read access to repository contents.
permissions:
  contents: read

# Cancel older checks for the same branch when a newer commit arrives.
concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-validate:
    name: Validate ${{ matrix.root }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        root:
          - aws/environments/dev
          - aws/environments/staging
          - aws/environments/prod
          - azure/environments/dev
          - azure/environments/staging
          - azure/environments/prod
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      # Check formatting without changing files.
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      # Skip backend initialization so the S3 and Azure state stores are not
      # required for this validation-only pipeline.
      - name: Initialize Terraform without a backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  tflint:
    name: TFLint ${{ matrix.root }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        root:
          - aws/environments/dev
          - aws/environments/staging
          - aws/environments/prod
          - azure/environments/dev
          - azure/environments/staging
          - azure/environments/prod
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint plugins
        run: tflint --init

      - name: Run TFLint
        run: tflint --no-color

  security-scan:
    name: Checkov security scan ${{ matrix.root }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        root:
          - aws/environments/dev
          - aws/environments/staging
          - aws/environments/prod
          - azure/environments/dev
          - azure/environments/staging
          - azure/environments/prod
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Static scan only; no AWS/Azure credentials or deployed resources needed.
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ matrix.root }}
          framework: terraform
          quiet: true
          # Report findings without blocking during the initial baseline review.
          # Change to false later to enforce the security checks.
          soft_fail: true
