# Validate Terraform configurations without deploying infrastructure.
name: Terraform CI

on:
  pull_request:
    paths:
      - "aws/**"
      - "azure/**"
      - ".github/workflows/**"
      - ".tflint.hcl"
      - ".trivyignore"
  push:
    branches:
      - main
    paths:
      - "aws/**"
      - "azure/**"
      - ".github/workflows/**"
      - ".tflint.hcl"
      - ".trivyignore"
  workflow_dispatch:

# CI only needs read access to the repository.
permissions:
  contents: read

# Cancel an older CI run when a newer commit arrives on the same branch.
concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check that all Terraform files follow standard formatting.
  format:
    name: Terraform formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      # Check formatting without modifying files.
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

  # Validate each independent Terraform root without initializing its backend.
  validate:
    name: Validate ${{ matrix.root }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        root:
          - aws/bootstrap
          - aws/environments/dev
          - aws/environments/staging
          - aws/environments/prod
          - azure/bootstrap
          - azure/environments/dev
          - azure/environments/staging
          - azure/environments/prod

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      # Skip the remote backend. No S3 bucket or Azure Storage Account is needed.
      - name: Initialize Terraform providers
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false

      # Check Terraform syntax and internal configuration consistency.
      - name: Validate Terraform
        working-directory: ${{ matrix.root }}
        run: terraform validate -no-color

  # Find common Terraform mistakes and style issues.
  lint:
    name: TFLint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint plugins
        run: tflint --init

      # Lint each root separately so environments remain independent.
      - name: Lint Terraform roots
        shell: bash
        run: |
          set -euo pipefail

          roots=(
            aws/bootstrap
            aws/environments/dev
            aws/environments/staging
            aws/environments/prod
            azure/bootstrap
            azure/environments/dev
            azure/environments/staging
            azure/environments/prod
          )

          for root in "${roots[@]}"; do
            echo "Linting ${root}"
            tflint --chdir="${root}"
          done

  # Scan Terraform files for common infrastructure security problems.
  security:
    name: Infrastructure security scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan Terraform configuration with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # Detect likely credentials accidentally committed to the repository.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}